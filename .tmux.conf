### Navigation
# As I mapped Caps Lock to Ctrl, I use Ctrl-a as tmux prefix
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix
set -g mouse on

bind r source-file "~/.tmux.conf"

# Pane navigation
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
set-option -g focus-events on
set-option -sg escape-time 10

### Styles
set-window-option -g window-status-current-style fg=#2d3436,bg=#c6d0f5,bright
set -g status-style bg=default
set -g default-terminal "tmux-256color"
set-option -a terminal-features 'xterm-256color:RGB'
set-option -a terminal-overrides 'xterm-256color:Tc'
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=#f1c40f,bright

# Status bar
set -g status-left "#[fg=#f9e2af] [#S] #(~/.config/scripts/tmux-status-jira.sh '#{@task}' '#{pane_current_path}')"

set-option -g status-right-length 150
set -g status-right "#(~/.config/scripts/tmux-status-jobs.sh)#(~/.config/scripts/tmux-status-portforwards.sh)#(~/.config/scripts/tmux-status-tsh.sh)"
set -g status-justify absolute-centre
set -g renumber-windows on
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g display-panes-time 2000
set -g status-left-length 100

# Rename tmux window to current directory
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'
# claude version name workaround
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m:*.*.*,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}'

# Increase history limit
set-option -g history-limit 50000

# Resize panes
bind -n M-k resize-pane -U 5
bind -n M-j resize-pane -D 5
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5

bind -n M-a display-popup -w 80% -h 85% -E ~/.config/scripts/tmux-show-popup.sh
bind C split-window -h -p 35 -c "#{pane_current_path}" "claude"
bind -T popup M-a detach

bind f run-shell "tmux neww ~/.config/scripts/tmux-session-dispensary.sh"
bind g run "~/.config/scripts/tmux-open-github.sh"
bind j display-popup -w 70% -h 50% -E ~/.config/scripts/tmux-pick-task.sh
bind t display-popup -w 60% -h 40% -EE 'tsh login corporate && rm -f "${TMPDIR:-/tmp}/tmux-tsh-status" && tmux refresh-client -S'
bind -T root MouseDown1Status if -F '#{m/r:^[A-Z][A-Z0-9]+-[0-9]+$,#{mouse_status_range}}' 'run "open https://traderepublic.atlassian.net/browse/#{mouse_status_range}"' 'select-window -t ='
bind E show-environment -g

source-file ~/.tmux/vim-tmux-navigator.tmux
